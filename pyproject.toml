[project]
name = "fashion-mnist-d2l"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "d2l>=0.17.0",
    "matplotlib>=3.11.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
